[tool.ruff]
target-version = "py312"
line-length = 125
preview = true

[tool.ruff.format]
quote-style = "single"
preview = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "missing-trailing-comma",
    "single-line-implicit-string-concatenation",
    "D10",
    "multi-line-summary-first-line",
    "incorrect-blank-line-before-class",
    "docstring-starts-with-this",
    "missing-copyright-notice",
    "no-self-use",
    "magic-value-comparison",
    "stdlib-module-shadowing",
    "unused-async",
    "none-not-at-end-of-union",
    "non-empty-init-module",
    "implicit-namespace-package",
    "assert",
    "boolean-positional-value-in-call",
    "call-datetime-now-without-tzinfo",
    "blind-except",
    "hardcoded-password-string",
    "private-member-access",
    "missing-todo-link",
    'builtin-argument-shadowing',
    'used-dummy-variable',
    "line-contains-todo",
    "pandas-use-of-dot-values",
    "raw-string-in-exception",
    "raise-vanilla-args",
    "missing-todo-author",
    "too-many-statements",
    "complex-structure",
    "too-many-branches",
    "too-many-arguments",
    "read-whole-file",
    "hardcoded-sql-expression",
]

[tool.ruff.lint.mccabe]
# Flag errors (`C901`) whenever the complexity level exceeds 5.
max-complexity = 15

[tool.ruff.lint.pylint]
max-returns = 10
max-locals = 20

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"

[tool.pyright]
ignore = ['config.py']
useLibraryCodeForTypes = true
typeCheckingMode = "strict"
pythonVersion = "3.12"
enableExperimentalFeatures = true
reportIncompatibleMethodOverride = false
reportCallInDefaultInitializer = true
reportImplicitStringConcatenation = true
reportMissingSuperCall = true
reportPropertyTypeMismatch = true
reportUnnecessaryTypeIgnoreComment = true
reportUnknownArgumentType = false
reportUnknownVariableType = false
